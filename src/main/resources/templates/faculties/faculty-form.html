<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>Faculty Registration</title>
</head>
<body>

    <div class="container">
        <h4>School of IT Faculty Directory</h4>
        <hr>
        <p class="h4 mb-4">Register Faculty</p>
        <form th:action="@{/Faculties/save}" th:object="${faculty}" method="POST"></form>

        <input type="text" th:field="*{firstName}"
               class="form-control mb-4 col-4" placeholder="First name" >
        <input type="text" th:field="*{lastName}"
               class="form-control mb-4 col-4" placeholder="Last name" >
        <input type="text" th:field="*{title}"
               class="form-control mb-4 col-4" placeholder="Title" >
        <input type="text" th:field="*{email}"
               class="form-control mb-4 col-4" placeholder="Email" >

        <!--Submit Button to add a new faculty-->
        <button type="submit" class="btn btn-danger col-2">Register</button>

    </div>

</body>
</html>
