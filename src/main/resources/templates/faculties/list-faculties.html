<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>Faculty Directory</title>
</head>

<div class="container">
    <h4>School of IT Faculty Director</h4>
    <hr/>
        <!--Create a button to add a new Faculty-->
        <a th:href="@{/Faculties/viewAddForm}" class="btn btn-dark btn-sm mb-2">Add New Faculty Here</a>

        <table class="table table-dark">
            <thead>
                <tr class="bg-danger">
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Title</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="theFaculty : ${faculties}">
                    <td th:text="${theFaculty.firstName}"></td>
                    <td th:text="${theFaculty.lastName}"></td>
                    <td th:text="${theFaculty.title}"></td>
                    <td th:text="${theFaculty.email}"></td>
                </tr>
            </tbody>
        </table>
</div>
</html>
